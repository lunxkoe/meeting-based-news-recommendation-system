<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <defs>
    <marker id="arrow-req" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/>
    </marker>
    <marker id="arrow-bg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16A34A"/>
    </marker>
    <style>
      .title { font-size: 16px; font-weight: 700; fill: #0F172A; }
      .sub { font-size: 12.5px; fill: #475569; }
      .group { font-size: 14px; font-weight: 700; }
      .layer { font-size: 12.5px; fill: #1E3A8A; }
      .item { font-size: 13px; fill: #334155; }
      .badge-num { font-size: 12px; font-weight: 700; fill: #FFFFFF; }
      .req { fill: none; stroke: #2563EB; stroke-width: 2; marker-end: url(#arrow-req); }
      .bg { fill: none; stroke: #16A34A; stroke-width: 2; stroke-dasharray: 7 5; marker-end: url(#arrow-bg); }
      .step { font-size: 13px; fill: #334155; }
    </style>
  </defs>

  <rect width="1400" height="720" fill="#FFFFFF"/>

  <!-- 외부 서비스 -->
  <rect x="520" y="20" width="860" height="122" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-dasharray="6 4"/>
  <text x="540" y="44" class="group" fill="#64748B">외부 서비스</text>

  <rect x="560" y="58" width="200" height="66" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="660" y="86" text-anchor="middle" class="title">Gemini API</text>
  <text x="660" y="108" text-anchor="middle" class="sub">회의록·뉴스 요약</text>

  <rect x="880" y="58" width="220" height="66" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="990" y="86" text-anchor="middle" class="title">Google Custom Search</text>
  <text x="990" y="108" text-anchor="middle" class="sub">뉴스 URL 검색</text>

  <rect x="1140" y="58" width="200" height="66" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="1240" y="86" text-anchor="middle" class="title">뉴스 사이트</text>
  <text x="1240" y="108" text-anchor="middle" class="sub">기사 본문</text>

  <!-- 브라우저 -->
  <rect x="24" y="275" width="140" height="90" rx="12" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="94" y="314" text-anchor="middle" class="title">브라우저</text>
  <text x="94" y="337" text-anchor="middle" class="sub">Jinja2 화면</text>

  <!-- FastAPI 서버 -->
  <rect x="240" y="200" width="260" height="240" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="260" y="228" class="group" fill="#1D4ED8">FastAPI 서버</text>
  <rect x="258" y="244" width="224" height="36" rx="8" fill="#FFFFFF" stroke="#BFDBFE"/>
  <text x="370" y="267" text-anchor="middle" class="layer">routers · 요청 처리</text>
  <rect x="258" y="290" width="224" height="36" rx="8" fill="#FFFFFF" stroke="#BFDBFE"/>
  <text x="370" y="313" text-anchor="middle" class="layer">services · 비즈니스 로직</text>
  <rect x="258" y="336" width="224" height="36" rx="8" fill="#FFFFFF" stroke="#BFDBFE"/>
  <text x="370" y="359" text-anchor="middle" class="layer">interfaces · 추상 인터페이스</text>
  <rect x="258" y="382" width="224" height="36" rx="8" fill="#FFFFFF" stroke="#BFDBFE"/>
  <text x="370" y="405" text-anchor="middle" class="layer">infrastructure · 구현체</text>

  <!-- Redis -->
  <path d="M570,294 v52 a70,12 0 0 0 140,0 v-52" fill="#FEF2F2" stroke="#F87171" stroke-width="1.5"/>
  <ellipse cx="640" cy="294" rx="70" ry="12" fill="#FEF2F2" stroke="#F87171" stroke-width="1.5"/>
  <text x="640" y="330" text-anchor="middle" class="title">Redis</text>
  <text x="640" y="350" text-anchor="middle" class="sub">작업 큐 · 결과 저장</text>

  <!-- Celery 워커 -->
  <rect x="780" y="200" width="600" height="240" rx="14" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.5"/>
  <text x="800" y="228" class="group" fill="#15803D">Celery 워커</text>

  <rect x="800" y="244" width="250" height="176" rx="10" fill="#FFFFFF" stroke="#86EFAC"/>
  <text x="925" y="272" text-anchor="middle" class="title">cpu_io 큐 워커</text>
  <text x="824" y="304" class="item">· 뉴스 검색 (최대 50건)</text>
  <text x="824" y="330" class="item">· 본문 크롤링 (병렬)</text>
  <text x="824" y="356" class="item">· 뉴스 요약 요청</text>
  <text x="824" y="382" class="item">· 추천 결과 저장</text>
  <text x="824" y="408" class="item">· 실패 시 단계별 대체 처리</text>

  <rect x="1110" y="244" width="250" height="176" rx="10" fill="#FFFFFF" stroke="#86EFAC"/>
  <text x="1235" y="272" text-anchor="middle" class="title">gpu 큐 워커</text>
  <text x="1134" y="304" class="item">· S-BERT 문장 임베딩</text>
  <text x="1134" y="330" class="item">· 회의록 요약문 ↔ 뉴스 본문</text>
  <text x="1146" y="356" class="item">코사인 유사도</text>
  <text x="1134" y="382" class="item">· 상위 5건 선별</text>
  <text x="1134" y="408" class="item">· GPU 없으면 CPU로 동작</text>

  <!-- MySQL -->
  <path d="M560,522 v56 a80,12 0 0 0 160,0 v-56" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5"/>
  <ellipse cx="640" cy="522" rx="80" ry="12" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="640" y="558" text-anchor="middle" class="title">MySQL</text>
  <text x="640" y="578" text-anchor="middle" class="sub">user · meetings</text>

  <!-- 요청 안에서 처리 (실선) -->
  <path d="M164,320 H236" class="req"/>
  <path d="M400,200 V160 H620 V128" class="req"/>
  <path d="M370,440 V550 H556" class="req"/>
  <path d="M500,320 H566" class="req"/>

  <!-- 백그라운드 작업 (점선) -->
  <path d="M710,320 H796" class="bg"/>
  <path d="M960,244 V128" class="bg"/>
  <path d="M1020,244 V178 H1200 V128" class="bg"/>
  <path d="M1050,332 H1106" class="bg" marker-start="url(#arrow-bg)"/>
  <path d="M895,244 V178 H720 V128" class="bg"/>
  <path d="M925,420 V550 H724" class="bg"/>

  <!-- 단계 번호 -->
  <g>
    <circle cx="200" cy="302" r="11" fill="#2563EB"/><text x="200" y="306" text-anchor="middle" class="badge-num">1</text>
    <circle cx="510" cy="160" r="11" fill="#2563EB"/><text x="510" y="164" text-anchor="middle" class="badge-num">2</text>
    <circle cx="470" cy="550" r="11" fill="#2563EB"/><text x="470" y="554" text-anchor="middle" class="badge-num">3</text>
    <circle cx="533" cy="302" r="11" fill="#2563EB"/><text x="533" y="306" text-anchor="middle" class="badge-num">4</text>
    <circle cx="753" cy="302" r="11" fill="#16A34A"/><text x="753" y="306" text-anchor="middle" class="badge-num">5</text>
    <circle cx="960" cy="168" r="11" fill="#16A34A"/><text x="960" y="172" text-anchor="middle" class="badge-num">6</text>
    <circle cx="1110" cy="178" r="11" fill="#16A34A"/><text x="1110" y="182" text-anchor="middle" class="badge-num">7</text>
    <circle cx="1080" cy="314" r="11" fill="#16A34A"/><text x="1080" y="318" text-anchor="middle" class="badge-num">8</text>
    <circle cx="790" cy="178" r="11" fill="#16A34A"/><text x="790" y="182" text-anchor="middle" class="badge-num">9</text>
    <circle cx="820" cy="550" r="11" fill="#16A34A"/><text x="820" y="554" text-anchor="middle" class="badge-num">10</text>
  </g>

  <!-- 범례 -->
  <line x1="24" y1="628" x2="1376" y2="628" stroke="#E2E8F0"/>
  <path d="M30,656 H70" class="req"/>
  <text x="80" y="660" class="step">요청 안에서 처리</text>
  <path d="M30,690 H70" class="bg"/>
  <text x="80" y="694" class="step">백그라운드 작업</text>

  <text x="250" y="660" class="step">① 회의록 제출</text>
  <text x="400" y="660" class="step">② 요약 + 키워드 5개 생성</text>
  <text x="610" y="660" class="step">③ 회의록 저장</text>
  <text x="760" y="660" class="step">④ 뉴스 분석 작업 발행 → 바로 응답</text>
  <text x="1060" y="660" class="step">⑤ 워커가 작업 수신</text>

  <text x="250" y="694" class="step">⑥ 키워드로 뉴스 검색</text>
  <text x="430" y="694" class="step">⑦ 뉴스 본문 수집</text>
  <text x="590" y="694" class="step">⑧ 유사도 상위 5건 선별 (Redis 경유 위임)</text>
  <text x="920" y="694" class="step">⑨ 뉴스 5건 요약</text>
  <text x="1080" y="694" class="step">⑩ 추천 결과 저장</text>
</svg>
